name: Update visual baselines

# Baselines are only valid when rendered on the Linux image CI checks with (specs/testing.md §6).
# Run this manually, download the `visual-baselines` artifact, and replace
# packages/core/test/visual/__screenshots__ with it. It holds every baseline: the selected ones
# re-rendered, and the rest as committed (specs/ci.md §8).
on:
  workflow_dispatch:
    inputs:
      groups:
        description: Gallery groups to re-render, comma-separated; empty for all.
        type: string
        default: ''
      themes:
        description: Themes to re-render, comma-separated; empty for all.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      visual: ${{ steps.matrix.outputs.visual }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - id: matrix
        env:
          PUNK_GALLERY_GROUPS: ${{ inputs.groups }}
          PUNK_GALLERY_THEMES: ${{ inputs.themes }}
        run: node scripts/ci-matrix.ts

  baselines:
    needs: plan
    uses: ./.github/workflows/visual.yml
    with:
      mode: update
      matrix: ${{ needs.plan.outputs.visual }}
      groups: ${{ inputs.groups }}
      themes: ${{ inputs.themes }}
