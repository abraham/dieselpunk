name: Publish

# Publishes @dieselpunk/core and @dieselpunk/locales to npm when a GitHub release is published
# (specs/package-contract.md §10). npm trusted publishing authenticates with this workflow's OIDC
# token, so there is no npm token, and npm attaches provenance on its own.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only `v*` tags may deploy to it, and npm's trusted publisher accepts only this environment.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Every branch's history, to find the tagged commit on main.
          fetch-depth: 0
          persist-credentials: false

      # main's ruleset requires ci-success, so a commit that was once main's tip has passed it. A
      # commit merged in from a branch is reachable from main without having been its tip.
      - name: Check that the tagged commit is on main
        run: |
          if ! git rev-list --first-parent origin/main | grep -qx "$GITHUB_SHA"; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) was never the tip of main"
            exit 1
          fi

      # Not the shared setup action: a release installs from the lockfile with no cache.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Check that the release tag is the packages' version
        run: |
          for package in core locales; do
            version=$(node -p "require('./packages/$package/package.json').version")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::packages/$package is $version, but the release is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - run: npm run check:lockfile
      - run: npm run build
      - run: npm run check:package
      # Before publishing, so a release that cannot describe itself is not published.
      - run: node scripts/sbom.ts sbom

      # Core first, since locales names it as a peer.
      - run: npm publish -w @dieselpunk/core
      - run: npm publish -w @dieselpunk/locales

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  # The one job that may write to the repository, and it runs nothing from it.
  sbom:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sbom
          path: sbom
      - run: gh release upload "$GITHUB_REF_NAME" sbom/*.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
