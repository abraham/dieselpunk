name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The consumer and framework checks drive Chromium; the browser suites and smoke test have their own jobs.
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - run: npm run check:toolchain
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:contrast
      - run: npm run check:strings
      - run: npm run check:api
      - run: npm run test:node --workspaces --if-present
      - run: npm run check:package
      - run: npm run check:size
      - run: npm run check:consumer
      - run: npm run check:frameworks

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
          build: true
      - run: npm run test:smoke

  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PUNK_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browser }}
      - run: npm run test:browser --workspaces --if-present

  # Runs in the image the baselines were rendered on, so pixels match (specs/testing.md §6).
  visual:
    name: visual (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Chromium renders the full matrix, about nine times the other projects, so it is split.
        include:
          - { project: chromium, shard: 1, shards: 2 }
          - { project: chromium, shard: 2, shards: 2 }
          - { project: chromium-forced, shard: 1, shards: 1 }
          - { project: firefox, shard: 1, shards: 1 }
          - { project: webkit, shard: 1, shards: 1 }
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      # Firefox refuses to start as root when $HOME belongs to another user, as it does by default here.
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run test:visual -w @dieselpunk/core -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-report-${{ matrix.project }}-${{ matrix.shard }}
          path: packages/core/test-results/
          retention-days: 7

  # The one check to require in branch protection: it passes only when every job above passed.
  ci-success:
    if: always()
    needs: [verify, smoke, browser, visual]
    runs-on: ubuntu-latest
    steps:
      - if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs passed."
