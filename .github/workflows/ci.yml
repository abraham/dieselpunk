name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Computes the matrices from the gallery groups, the test listing, and the workbench index (specs/ci.md §6).
  plan:
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.matrix.outputs.visual }}
      smoke: ${{ steps.matrix.outputs.smoke }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: matrix
        run: node scripts/ci-matrix.ts

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check:toolchain
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:contrast
      - run: npm run check:strings
      - run: npm run check:api
      - run: npm run test:node --workspaces --if-present
      - run: npm run check:package
      - run: npm run check:size

  # The only checks outside the browser suites that drive a browser.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
          build: true
      - run: npm run check:consumer
      - run: npm run check:frameworks

  smoke:
    name: smoke (${{ matrix.part }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.smoke) }}
    env:
      PUNK_SMOKE_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
          build: true
      - run: npm run test:smoke

  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PUNK_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browser }}
      - run: npm run test:browser --workspaces --if-present

  visual:
    needs: plan
    uses: ./.github/workflows/visual.yml
    with:
      mode: check
      matrix: ${{ needs.plan.outputs.visual }}

  # The one check to require in branch protection: it passes only when every job above passed.
  ci-success:
    if: always()
    needs: [plan, static, integration, smoke, browser, visual]
    runs-on: ubuntu-latest
    steps:
      - if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs passed."
