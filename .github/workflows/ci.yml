name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer commit cancels a pull request's older run; each push to `main` has a group of its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # The plan reads the last run's job durations for its budget summary.
  actions: read

jobs:
  # Computes the matrices from the gallery groups, the test listing, and the workbench index, and
  # whether the change needs more than `static` (specs/ci.md §6, §7).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      visual: ${{ steps.matrix.outputs.visual }}
      smoke: ${{ steps.matrix.outputs.smoke }}
      browser: ${{ steps.matrix.outputs.browser }}
      full: ${{ steps.matrix.outputs.full }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The merge commit and its base, to list what the pull request changes.
          fetch-depth: 2
          persist-credentials: false
      - uses: $/.github/actions/setup
      - id: matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-matrix.ts

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The runner enforces actions.lock; this also fails on an action the lock does not list.
      - name: Verify the actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --verify --no-interactive
      - uses: $/.github/actions/setup
      - run: npm run check:toolchain
      - run: npm run check:lockfile
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:contrast
      - run: npm run check:strings
      - run: npm run check:api
      - run: npm run test:node --workspaces --if-present
      - run: npm run check:package
      - run: npm run check:size

  # The only checks outside the browser suites that drive a browser.
  integration:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          browsers: chromium
          build: true
      - run: npm run check:consumer
      - run: npm run check:frameworks

  smoke:
    name: smoke (${{ matrix.part }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.smoke) }}
    env:
      PUNK_SMOKE_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          browsers: chromium
          build: true
      - run: npm run test:smoke
      - run: npm run test:stories -w @dieselpunk/workbench -- --shard="$PUNK_SMOKE_PART"

  browser:
    name: browser (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.browser) }}
    env:
      PUNK_BROWSERS: ${{ matrix.engine }}
      PUNK_BROWSER_PART: ${{ matrix.part }}
      PUNK_GALLERY_GROUPS: ${{ matrix.groups }}
      PUNK_GALLERY_THEMES: ${{ matrix.themes }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          browsers: ${{ matrix.engine }}
      - run: npm run test:browser --workspaces --if-present

  visual:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/visual.yml
    with:
      mode: check
      matrix: ${{ needs.plan.outputs.visual }}

  # Dependency review on pull requests, CodeQL on both (specs/security.md §5.2, §6.1). The
  # analysis of main is the baseline that code scanning compares a pull request with.
  security:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Licenses are checked by check:lockfile, for the published packages' runtime trees only.
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          license-check: false
      - uses: github/codeql-action/init@v4.39.0
        with:
          languages: javascript-typescript, actions
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4.39.0
        with:
          output: codeql-results
      # After the analysis, so the installed packages are not in the tree it reads.
      - if: github.event_name == 'pull_request'
        uses: $/.github/actions/setup
      - if: github.event_name == 'pull_request'
        run: node scripts/check-codeql.ts codeql-results

  # The one check to require in branch protection: it passes only when every job above passed.
  ci-success:
    if: always()
    needs: [plan, static, integration, smoke, browser, visual, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A job may be skipped only when the plan skipped it for a prose-only change.
      - if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          (needs.plan.outputs.full != 'false' && contains(needs.*.result, 'skipped'))
        run: exit 1
      - run: echo "All CI jobs passed."
