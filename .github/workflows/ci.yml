name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The consumer, framework, and smoke checks drive Chromium; the browser suites have their own jobs.
      - run: npx playwright install --with-deps chromium
      - run: npm run check:toolchain
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:contrast
      - run: npm run check:strings
      - run: npm run check:api
      - run: npm run test:node --workspaces --if-present
      - run: npm run check:package
      - run: npm run check:size
      - run: npm run check:consumer
      - run: npm run check:frameworks
      - run: npm run test:smoke

  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PUNK_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser --workspaces --if-present

  # Runs in the image the baselines were rendered on, so pixels match (specs/testing.md §6).
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      # Firefox refuses to start as root when $HOME belongs to another user, as it does by default here.
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-report
          path: packages/core/test-results/
          retention-days: 7
