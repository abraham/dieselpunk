name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Computes the matrices from the gallery groups, the test listing, and the workbench index (specs/ci.md §6).
  plan:
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.matrix.outputs.visual }}
      smoke: ${{ steps.matrix.outputs.smoke }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: matrix
        run: node scripts/ci-matrix.ts

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check:toolchain
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:contrast
      - run: npm run check:strings
      - run: npm run check:api
      - run: npm run test:node --workspaces --if-present
      - run: npm run check:package
      - run: npm run check:size

  # The only checks outside the browser suites that drive a browser.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
          build: true
      - run: npm run check:consumer
      - run: npm run check:frameworks

  smoke:
    name: smoke (${{ matrix.part }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.smoke) }}
    env:
      PUNK_SMOKE_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
          build: true
      - run: npm run test:smoke

  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PUNK_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browser }}
      - run: npm run test:browser --workspaces --if-present

  # Runs in the image the baselines were rendered on, so pixels match (specs/testing.md §6).
  visual:
    name: visual (${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.visual) }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      # Firefox refuses to start as root when $HOME belongs to another user, as it does by default here.
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - working-directory: packages/core
        env:
          PROJECT: ${{ matrix.project }}
          GREP: ${{ matrix.grep }}
        run: node scripts/visual.ts check --project="$PROJECT" --grep="$GREP"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-report-${{ matrix.id }}
          path: packages/core/test-results/
          retention-days: 7

  # The one check to require in branch protection: it passes only when every job above passed.
  ci-success:
    if: always()
    needs: [plan, static, integration, smoke, browser, visual]
    runs-on: ubuntu-latest
    steps:
      - if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs passed."
