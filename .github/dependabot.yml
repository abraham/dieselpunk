version: 2

updates:
  # One entry covers every npm workspace, because they share the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # These packages release together and must stay on matching versions.
      storybook:
        patterns: ['storybook', '@storybook/*', '@wc-toolkit/*', '@etchteam/storybook-addon-*']
      size-limit:
        patterns: ['size-limit', '@size-limit/*']
      vitest:
        patterns: ['vitest', '@vitest/*']
      lint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'prettier']
      fonts:
        patterns: ['@fontsource/*']
      # The framework fixtures (specs/toolchain.md §7) each bump their own conventions for custom
      # elements, so they come in one pull request that is read before it is merged.
      frameworks:
        patterns:
          [
            'react',
            'react-dom',
            '@types/react',
            '@types/react-dom',
            'vue',
            '@vue/*',
            'svelte',
            'esbuild-svelte',
          ]
    ignore:
      # TypeScript is held at 6.0 until typescript-eslint supports a newer release (specs/toolchain.md §2).
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # A new major of a framework is a change to its guide, and is made by hand.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: vue
        update-types: ['version-update:semver-major']
      - dependency-name: svelte
        update-types: ['version-update:semver-major']
      # The types follow the Node major in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
