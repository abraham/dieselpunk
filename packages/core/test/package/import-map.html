<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dieselpunk without a build step</title>
    <link rel="stylesheet" href="/node_modules/@dieselpunk/core/dist/css/tokens.css" />
    <link rel="stylesheet" href="/node_modules/@dieselpunk/core/dist/css/themes.css" />
    <script type="importmap">
      {
        "imports": {
          "@dieselpunk/core/": "/node_modules/@dieselpunk/core/dist/components/",
          "lit": "/node_modules/lit/index.js",
          "lit/": "/node_modules/lit/",
          "lit-html": "/node_modules/lit-html/lit-html.js",
          "lit-html/": "/node_modules/lit-html/",
          "lit-element/": "/node_modules/lit-element/",
          "@lit/reactive-element": "/node_modules/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/node_modules/@lit/reactive-element/",
          "@lit/localize": "/node_modules/@lit/localize/lit-localize.js",
          "@lit/localize/": "/node_modules/@lit/localize/"
        }
      }
    </script>
    <script type="module">
      import '@dieselpunk/core/panel/register.js';
      import '@dieselpunk/core/divider/register.js';
      import '@dieselpunk/core/button/register.js';
    </script>
  </head>
  <body>
    <punk-panel>
      <span slot="header">Assembler</span>
      <p>Iron gear wheel</p>
      <punk-divider></punk-divider>
      <punk-button variant="primary">Start</punk-button>
    </punk-panel>
  </body>
</html>
